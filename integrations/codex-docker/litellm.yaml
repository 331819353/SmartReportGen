# AI 网关（OpenAI 兼容 Chat Completions）上的模型，供 Codex 经 Responses API 调用。
# 网关地址与密钥来自环境变量 AI_BASE_URL / AI_API_KEY（与 SmartReportGen 的 .env 相同）。
model_list:
  - model_name: DeepSeek-V4-Flash
    litellm_params:
      model: openai/DeepSeek-V4-Flash
      api_base: os.environ/AI_BASE_URL
      api_key: os.environ/AI_API_KEY
      timeout: 300
      use_chat_completions_api: true   # 网关没有 /responses：把 Responses 请求转换为 Chat Completions

litellm_settings:
  drop_params: true          # 网关不支持的参数（如 reasoning、store）直接丢弃
  num_retries: 2
