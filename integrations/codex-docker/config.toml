# 容器内的 Codex 配置。不要在这里写任何密钥：
#   LITELLM_MASTER_KEY 访问 compose 内 llm-bridge（LiteLLM）的密钥；AI 网关密钥只在 llm-bridge 中
#   SMARTREPORT_TOKEN  员工 MCP 令牌（管理台「我的令牌」签发）
model = "DeepSeek-V4-Flash"
model_provider = "ai_gateway"
approval_policy = "never"
sandbox_mode = "danger-full-access"   # 容器本身即隔离环境

# Codex 只支持 Responses API；AI 网关只有 Chat Completions，由 llm-bridge 转换
[model_providers.ai_gateway]
name = "AI Gateway via LiteLLM"
base_url = "http://llm-bridge:4000/v1"
env_key = "LITELLM_MASTER_KEY"
wire_api = "responses"

[mcp_servers.smartreportgen]
url = "http://mcp:8001/mcp"           # compose 网络内的 MCP 服务
bearer_token_env_var = "SMARTREPORT_TOKEN"
startup_timeout_sec = 30
tool_timeout_sec = 300
