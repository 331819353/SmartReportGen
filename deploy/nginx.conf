# 容器重建后由 Docker DNS 刷新地址，网关可以继续运行。
resolver 127.0.0.11 valid=10s ipv6=off;

upstream report_api {
    zone report_api 64k;
    server api:8000 resolve;
}

upstream report_mcp {
    zone report_mcp 64k;
    server mcp:8001 resolve;
}

# OAuth 回调的查询参数含临时授权码，网关日志只记录路径。
log_format report_access '$remote_addr "$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
    listen 8080;
    server_name _;
    access_log /var/log/nginx/access.log report_access;
    client_max_body_size 0;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Connection "";
    proxy_read_timeout 300s;

    # MCP 请求及其资源发现由 MCP 后端处理，保留流式响应。
    location ~ ^/(mcp|\.well-known/oauth-protected-resource)(/|$) {
        proxy_pass http://report_mcp;
        proxy_buffering off;
    }

    # 管理台、报告、OAuth 授权发现和 IAM 回调走管理 API。
    location / {
        proxy_pass http://report_api;
    }
}
