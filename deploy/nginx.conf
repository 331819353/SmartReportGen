upstream report_api {
    server api:8000;
}

upstream report_mcp {
    server mcp:8001;
}

# 管理台 IAM 回调的查询参数含临时授权码，网关日志只记录路径。
log_format report_access '$remote_addr "$request_method $uri $server_protocol" $status $body_bytes_sent '
                         'request_time=$request_time upstream_time=$upstream_response_time';

server {
    listen 8080;
    server_name _;
    access_log /var/log/nginx/access.log report_access;
    client_max_body_size 0;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Connection "";
    proxy_read_timeout 300s;

    # /mcp 由 MCP 后端校验 IAM Bearer 令牌，保留流式响应。
    location ~ ^/mcp(/|$) {
        proxy_pass http://report_mcp;
        proxy_buffering off;
    }

    # 管理台、报告和 IAM 回调走管理 API。
    location / {
        proxy_pass http://report_api;
    }
}
